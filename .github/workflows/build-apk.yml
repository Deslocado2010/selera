name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: unzip -q "$(ls *.zip | head -n 1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: SelarasCircle
        run: gradle assembleDebug --stacktrace

      - name: Unit test (tidak menggagalkan APK)
        working-directory: SelarasCircle
        continue-on-error: true
        run: gradle testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: SelarasCircle-debug-apk
          path: SelarasCircle/app/build/outputs/apk/debug/app-debug.apk
